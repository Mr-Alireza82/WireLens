[versions]
java = "21"
javafx = "21.0.5"
openjfx-gradle-plugin = "0.1.0"
atlantafx = "2.0.1"
ikonli = "12.3.1"
base-conversion = "v1.0.1"
junit = "5.11.3"
assertj = "3.26.3"

[libraries]
base-conversion = { module = "com.github.Mr-Alireza82:Base-Conversion", version.ref = "base-conversion" }
atlantafx = { module = "io.github.mkpaz:atlantafx-base", version.ref = "atlantafx" }
ikonli-javafx = { module = "org.kordamp.ikonli:ikonli-javafx", version.ref = "ikonli" }
ikonli-feather = { module = "org.kordamp.ikonli:ikonli-feather-pack", version.ref = "ikonli" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
javafx = { id = "org.openjfx.javafxplugin", version.ref = "openjfx-gradle-plugin" }
